<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview link maker — Invitashion</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#32127A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Internal tool (not linked anywhere): type the names from an Instagram comment, copy a ready DM
   with a personalised preview link. Add a design to DESIGNS below once it supports ?a=&b=. */
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:linear-gradient(110deg,#32127A 0%,#5A2A9A 50%,#00A0A0 100%);--ink:#24164A;--muted:#4F4570}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:#F4F0FC;min-height:100vh;padding:20px 16px 40px}
.card{max-width:440px;margin:0 auto;background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:22px 20px}
h1{font:800 26px/1.1 'Baloo 2',sans-serif}
.hint{color:var(--muted);font-size:14px;margin-top:4px}
label{display:block;font-weight:800;font-size:14px;margin:16px 0 6px}
input,select,textarea{width:100%;font:600 17px 'Nunito',sans-serif;color:var(--ink);padding:12px 14px;border:2px solid #D9D0EE;border-radius:14px;background:#FBF9FF}
input:focus,select:focus,textarea:focus{outline:none;border-color:#5A2A9A}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.row .amp{font:800 22px 'Baloo 2';padding-bottom:10px;color:#5A2A9A}
textarea{font-size:15px;line-height:1.45;min-height:150px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button,a.btn{flex:1;min-width:130px;display:inline-flex;justify-content:center;align-items:center;gap:6px;font:800 16px 'Nunito';padding:13px 16px;border-radius:999px;
  border:2.5px solid var(--ink);cursor:pointer;text-decoration:none;color:#fff;background:var(--brand);box-shadow:3px 3px 0 var(--ink)}
button.alt,a.btn.alt{background:#fff;color:var(--ink)}
button:disabled,a.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.link{margin-top:10px;font-size:13px;color:var(--muted);word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;transition:all .25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="card">
  <h1>Preview link maker</h1>
  <p class="hint">Type the names from the comment, then copy the DM.</p>

  <label for="design">Design</label>
  <select id="design"></select>

  <div class="row">
    <div><label for="a">First name</label><input id="a" autocomplete="off" autocapitalize="words" placeholder="Priya"></div>
    <span class="amp">&amp;</span>
    <div><label for="b">Second name</label><input id="b" autocomplete="off" autocapitalize="words" placeholder="Rahul"></div>
  </div>

  <label for="msg">Message</label>
  <textarea id="msg" readonly></textarea>
  <p class="link" id="link"></p>

  <div class="btns">
    <button id="copyMsg" type="button">Copy message</button>
    <button id="copyLink" class="alt" type="button">Copy link</button>
  </div>
  <div class="btns"><a id="open" class="btn alt" target="_blank" rel="noopener">Open preview ↗</a></div>
</div>
<div class="toast" id="toast">Copied ✓</div>

<script>
// Designs that accept names in the link (?a=&b=)
const DESIGNS = [
  { path: 'beach-palms', name: 'Palm Beach Wedding' },
];
const $ = id => document.getElementById(id);
DESIGNS.forEach((d, i) => $('design').add(new Option(d.name, i)));
const tidy = v => v.replace(/\s+/g, ' ').trim().replace(/^\p{Ll}/u, c => c.toUpperCase());
function update() {
  const d = DESIGNS[$('design').value], a = tidy($('a').value), b = tidy($('b').value), ok = a && b;
  const url = 'https://invitashion.online/' + d.path + '/?' + new URLSearchParams({ a, b });
  $('msg').value = ok ? `Hi ${a} & ${b}! 💌 Here's your ${d.name} invite with your names:\n${url}\n\nOpen it on your phone with sound on 🔊 We'll add your date, venue, photos and music to make it fully yours. Want to go ahead?` : '';
  $('link').textContent = ok ? url : '';
  $('open').href = ok ? url : '#';
  $('open').setAttribute('aria-disabled', !ok);
  $('copyMsg').disabled = $('copyLink').disabled = !ok;
}
['design', 'a', 'b'].forEach(id => $(id).addEventListener('input', update));
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1400);
}
$('copyMsg').addEventListener('click', () => copy($('msg').value));
$('copyLink').addEventListener('click', () => copy($('link').textContent));
update();
</script>
</body>
</html>
